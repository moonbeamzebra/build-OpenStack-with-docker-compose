services:
  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: openstack-rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    networks:
      - openstack-net
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbitmq/rabbitmq_definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/rabbitmq.config:/etc/rabbitmq/rabbitmq.config:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: openstack-postgres
    hostname: postgres
    restart: unless-stopped
    networks:
      - openstack-net
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - /var/lib/openstack-postgres/data:/var/lib/postgresql/data
      - ./postgres/check_postgreSQL.sh:/usr/local/bin/check_postgreSQL.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/check_postgreSQL.sh"]
      interval: 5s
      timeout: 3s
      retries: 20

  memcached:
    image: memcached:1.6
    container_name: openstack-memcached
    hostname: memcached
    restart: unless-stopped
    networks:
      - openstack-net
    command: memcached -m 64
    ports:
      - "11211:11211"
    healthcheck:
      test: ["CMD", "memcached", "-h"]
      interval: 5s
      timeout: 3s
      retries: 5

  keystone:
    build:
      context: .
      dockerfile: keystone/keystone-dockerfile
    container_name: openstack-keystone
    hostname: keystone
    restart: unless-stopped
    networks:
      - openstack-net
    ports:
      - "5000:5000"
    env_file:
      - ./env.list
    depends_on:
      memcached:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/v3 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  keystone-init:
    build:
      context: .
      dockerfile: keystone/keystone-init-dockerfile
    container_name: keystone-init
    hostname: keystone-init
    networks:
      - openstack-net
    env_file:
      - ./env.list
    depends_on:
      keystone:
        condition: service_healthy
    restart: "no"

  glance:
    build:
      context: .
      dockerfile: glance/glance-dockerfile
    container_name: openstack-glance
    hostname: glance
    restart: unless-stopped
    networks:
      - openstack-net
    ports:
      - "9292:9292"
    env_file:
      - ./env.list
    depends_on:
      postgres:
        condition: service_healthy
      keystone:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9292/ | grep -q CURRENT"]
      interval: 5s
      timeout: 3s
      retries: 20

  placement:
    build:
      context: .
      dockerfile: placement/placement-dockerfile
    container_name: openstack-placement
    hostname: placement
    restart: unless-stopped
    networks:
      - openstack-net
    ports:
      - "8778:8778"
    env_file:
      - ./env.list
    depends_on:
      postgres:
        condition: service_healthy
      keystone:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8778/ | grep -q CURRENT"]
      interval: 5s
      timeout: 3s
      retries: 20

  nova-api:
    build:
      context: .
      dockerfile: nova/nova-dockerfile
    container_name: openstack-nova-api
    hostname: nova-api
    restart: unless-stopped
    networks:
      - openstack-net
    ports:
      - "8774:8774"
    env_file:
      - ./env.list
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keystone:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8774 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  nova-scheduler:
    build:
      context: .
      dockerfile: nova/nova-others-dockerfile
    container_name: openstack-nova-scheduler
    hostname: nova-scheduler
    command: nova-scheduler
    restart: unless-stopped
    networks:
      - openstack-net
    env_file:
      - ./env.list
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keystone:
        condition: service_healthy
      nova-api:
        condition: service_healthy
      placement:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f nova-scheduler || exit 1"]

  nova-conductor:
    build:
      context: .
      dockerfile: nova/nova-others-dockerfile
    container_name: openstack-nova-conductor
    hostname: nova-conductor
    command: nova-conductor
    restart: unless-stopped
    networks:
      - openstack-net
    env_file:
      - ./env.list
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keystone:
        condition: service_healthy
      nova-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f nova-conductor || exit 1"]

  nova-novncproxy:
    build:
      context: .
      dockerfile: nova/nova-others-dockerfile
    container_name: openstack-nova-novncproxy
    hostname: nova-novncproxy
    command: nova-novncproxy
    restart: unless-stopped
    networks:
      - openstack-net
    ports:
      - "6080:6080"
    env_file:
      - ./env.list
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keystone:
        condition: service_healthy
      nova-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6080 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

networks:
  openstack-net:
    driver: bridge
