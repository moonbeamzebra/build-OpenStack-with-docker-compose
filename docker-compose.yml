services:
  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: openstack-rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    networks:
      - openstack-net
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbitmq/rabbitmq_definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/rabbitmq.config:/etc/rabbitmq/rabbitmq.config:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: openstack-postgres
    hostname: postgres
    restart: unless-stopped
    networks:
      - openstack-net
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - /var/lib/openstack-postgres/data:/var/lib/postgresql/data
      - ./postgres/check_postgreSQL.sh:/usr/local/bin/check_postgreSQL.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/check_postgreSQL.sh"]
      interval: 5s
      timeout: 3s
      retries: 20

  memcached:
    image: memcached:1.6
    container_name: openstack-memcached
    hostname: memcached
    restart: unless-stopped
    networks:
      - openstack-net
    command: memcached -m 64
    ports:
      - "11211:11211"
    healthcheck:
      test: ["CMD", "memcached", "-h"]
      interval: 5s
      timeout: 3s
      retries: 5

  keystone:
    build:
      context: .
      dockerfile: keystone/keystone-dockerfile
    container_name: openstack-keystone
    hostname: keystone
    restart: unless-stopped
    networks:
      - openstack-net
    ports:
      - "5000:5000"
    env_file:
      - ./env.list
    depends_on:
      memcached:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/v3 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  keystone-init:
    build:
      context: .
      dockerfile: keystone/keystone-init-dockerfile
    container_name: keystone-init
    hostname: keystone-init
    networks:
      - openstack-net
    env_file:
      - ./env.list
    depends_on:
      keystone:
        condition: service_healthy
    restart: "no"

  glance:
    build:
      context: .
      dockerfile: glance/glance-dockerfile
    container_name: openstack-glance
    hostname: glance
    restart: unless-stopped
    networks:
      - openstack-net
    ports:
      - "9292:9292"
    env_file:
      - ./env.list
    depends_on:
      postgres:
        condition: service_healthy
      keystone:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9292/ | grep -q CURRENT"]
      interval: 5s
      timeout: 3s
      retries: 20

  placement:
    build:
      context: .
      dockerfile: placement/placement-dockerfile
    container_name: openstack-placement
    hostname: placement
    restart: unless-stopped
    networks:
      - openstack-net
    ports:
      - "8778:8778"
    env_file:
      - ./env.list
    depends_on:
      postgres:
        condition: service_healthy
      keystone:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8778/ | grep -q CURRENT"]
      interval: 5s
      timeout: 3s
      retries: 20

  nova-api:
    build:
      context: .
      dockerfile: nova/nova-dockerfile
    container_name: openstack-nova-api
    hostname: nova-api
    restart: unless-stopped
    networks:
      - openstack-net
    ports:
      - "8774:8774"
      - "8775:8775"
    env_file:
      - ./env.list
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keystone:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8774 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  nova-scheduler:
    build:
      context: .
      dockerfile: nova/nova-others-dockerfile
    container_name: openstack-nova-scheduler
    hostname: nova-scheduler
    command: nova-scheduler
    restart: unless-stopped
    networks:
      - openstack-net
    env_file:
      - ./env.list
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keystone:
        condition: service_healthy
      nova-api:
        condition: service_healthy
      placement:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f nova-scheduler || exit 1"]

  nova-conductor:
    build:
      context: .
      dockerfile: nova/nova-others-dockerfile
    container_name: openstack-nova-conductor
    hostname: nova-conductor
    command: nova-conductor
    restart: unless-stopped
    networks:
      - openstack-net
    env_file:
      - ./env.list
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keystone:
        condition: service_healthy
      nova-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f nova-conductor || exit 1"]

  nova-novncproxy:
    build:
      context: .
      dockerfile: nova/nova-others-dockerfile
    container_name: openstack-nova-novncproxy
    hostname: nova-novncproxy
    command: nova-novncproxy
    restart: unless-stopped
    networks:
      - openstack-net
    ports:
      - "6080:6080"
    env_file:
      - ./env.list
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keystone:
        condition: service_healthy
      nova-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6080 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  nova-compute:
    build:
      context: .
      dockerfile: nova/nova-compute-dockerfile
    container_name: openstack-nova-compute
    hostname: nova-compute
    privileged: true
    network_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup
      - /lib/modules:/lib/modules:ro
      - /var/lib/openstack-nova-compute:/var/lib/nova
      - /var/lib/openstack-nova-instances:/var/lib/nova/instances
    environment:
      - LIBVIRT_DEFAULT_URI=qemu:///system
    command: >
      bash -c "
      virtlogd -d &&
      virtlockd -d &&
      libvirtd -d &&
      sleep 3 &&
      nova-compute
      "
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keystone:
        condition: service_healthy
      nova-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f nova-compute && virsh -c qemu:///system list >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
    extra_hosts:
      - "rabbitmq:127.0.0.1"
      - "postgres:127.0.0.1"
      - "memcached:127.0.0.1"
      - "keystone:127.0.0.1"
      - "keystone-init:127.0.0.1"
      - "glance:127.0.0.1"
      - "placement:127.0.0.1"
      - "nova-api:127.0.0.1"
      - "nova-scheduler:127.0.0.1"
      - "nova-conductor:127.0.0.1"
      - "nova-novncproxy:127.0.0.1"
      - "nova-compute:127.0.0.1"
      - "neutron:127.0.0.1"

  neutron:
    build:
      context: .
      dockerfile: neutron/neutron-dockerfile
    container_name: openstack-neutron
    hostname: neutron
    restart: unless-stopped
    networks:
      openstack-net:
        ipv4_address: 172.19.0.30
    ports:
      - "9696:9696"
    env_file:
      - ./env.list
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keystone:
        condition: service_healthy
      nova-api:
        condition: service_healthy
      placement:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9696 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  neutron-agents:
    image: neutron-base
    container_name: openstack-neutron-agents
    hostname: neutron-agents
    network_mode: host
    privileged: true
    restart: unless-stopped
    volumes:
      - /lib/modules:/lib/modules:ro
      - /run/netns:/run/netns:shared
      - /run:/run
    command: >
      bash -c "
      neutron-linuxbridge-agent --config-file /etc/neutron/plugins/ml2/linuxbridge_agent.ini --config-file /etc/neutron/plugins/ml2/ml2_conf.ini --config-file /etc/neutron/neutron.conf &
      neutron-dhcp-agent --config-file /etc/neutron/neutron.conf --config-file /etc/neutron/dhcp_agent.ini &
      neutron-l3-agent --config-file /etc/neutron/neutron.conf --config-file /etc/neutron/l3_agent.ini &
      neutron-metadata-agent --config-file /etc/neutron/neutron.conf --config-file /etc/neutron/metadata_agent.ini &
      wait"
    environment:
      - OSLO_CONFIG_DIR=/etc/neutron
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keystone:
        condition: service_healthy
      nova-api:
        condition: service_healthy
      placement:
        condition: service_healthy
    extra_hosts:
      - "rabbitmq:127.0.0.1"
      - "postgres:127.0.0.1"
      - "memcached:127.0.0.1"
      - "keystone:127.0.0.1"
      - "keystone-init:127.0.0.1"
      - "glance:127.0.0.1"
      - "placement:127.0.0.1"
      - "nova-api:127.0.0.1"
      - "nova-scheduler:127.0.0.1"
      - "nova-conductor:127.0.0.1"
      - "nova-novncproxy:127.0.0.1"
      - "nova-compute:127.0.0.1"
      - "neutron:127.0.0.1"

networks:
  openstack-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16
