services:
  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: openstack-rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./rabbitmq/rabbitmq_definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/rabbitmq.config:/etc/rabbitmq/rabbitmq.config:ro
    extra_hosts:
      - "rabbit-host:192.168.86.232"
      - "keystone-host:192.168.86.232"
      - "horizon-host:192.168.86.232"
      - "cinder-host:192.168.86.232"
      - "glance-host:192.168.86.232"
      - "nova-host:192.168.86.232"
      - "neutron-host:192.168.86.232"
      - "heat-host:192.168.86.232"
      - "mongo-host:192.168.86.232"
      - "ceil-host:192.168.86.232"
      - "mysql-host:192.168.86.232"
      - "postgres-host:192.168.86.232"

  postgres:
    image: postgres:16
    container_name: openstack-postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - /var/lib/openstack-postgres/data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    extra_hosts:
      - "rabbit-host:192.168.86.232"
      - "keystone-host:192.168.86.232"
      - "horizon-host:192.168.86.232"
      - "cinder-host:192.168.86.232"
      - "glance-host:192.168.86.232"
      - "nova-host:192.168.86.232"
      - "neutron-host:192.168.86.232"
      - "heat-host:192.168.86.232"
      - "mongo-host:192.168.86.232"
      - "ceil-host:192.168.86.232"
      - "mysql-host:192.168.86.232"
      - "postgres-host:192.168.86.232"

  openstack-keystone:
    build:
      context: .
      dockerfile: keystone-dockerfile
    container_name: openstack-keystone
    hostname: keystone
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "11211:11211"
    env_file:
      - ./env.list
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/v3 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    links:
      - postgres
    environment:
      - WAIT_SLEEP=1
      - WAIT_LOOPS=100
    extra_hosts:
      - "rabbit-host:192.168.86.232"
      - "keystone-host:192.168.86.232"
      - "horizon-host:192.168.86.232"
      - "cinder-host:192.168.86.232"
      - "glance-host:192.168.86.232"
      - "nova-host:192.168.86.232"
      - "neutron-host:192.168.86.232"
      - "heat-host:192.168.86.232"
      - "mongo-host:192.168.86.232"
      - "ceil-host:192.168.86.232"
      - "mysql-host:192.168.86.232"
      - "postgres-host:192.168.86.232"

  openstack-glance:
    build:
      context: .
      dockerfile: glance-dockerfile
    container_name: openstack-glance
    hostname: glance
    restart: unless-stopped
    ports:
      - "9292:9292"
    env_file:
      - ./env.list
    depends_on:
      postgres:
        condition: service_healthy
      openstack-keystone:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9292/ | grep -q CURRENT"]
      interval: 5s
      timeout: 3s
      retries: 20
    extra_hosts:
      - "rabbit-host:192.168.86.232"
      - "keystone-host:192.168.86.232"
      - "horizon-host:192.168.86.232"
      - "cinder-host:192.168.86.232"
      - "glance-host:192.168.86.232"
      - "nova-host:192.168.86.232"
      - "neutron-host:192.168.86.232"
      - "heat-host:192.168.86.232"
      - "mongo-host:192.168.86.232"
      - "ceil-host:192.168.86.232"
      - "mysql-host:192.168.86.232"
      - "postgres-host:192.168.86.232"
